apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: frontend-deny-dns-by-omission
  namespace: app
spec:
  endpointSelector:
    matchLabels:
      app: frontend
  egress:
    - toEndpoints:
        - matchLabels:
            app: api
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
