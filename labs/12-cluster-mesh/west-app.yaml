apiVersion: v1
kind: Namespace
metadata:
  name: mesh-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: mesh-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
      cluster: west
  template:
    metadata:
      labels:
        app: api
        cluster: west
    spec:
      containers:
        - name: httpbin
          image: mccutchen/go-httpbin:v2.14.0
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: mesh-demo
  annotations:
    service.cilium.io/global: "true"
    service.cilium.io/shared: "true"
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 80
      targetPort: 8080
