apiVersion: v1
kind: Namespace
metadata:
  name: mesh-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: mesh-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: curl
          image: curlimages/curl:8.11.1
          command: ["sleep", "3600"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: mesh-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
      cluster: west
  template:
    metadata:
      labels:
        app: api
        cluster: west
    spec:
      containers:
        - name: echo
          image: hashicorp/http-echo:1.0
          args:
            - -listen=:8080
            - -text=west-api
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: mesh-demo
  annotations:
    service.cilium.io/global: "true"
    service.cilium.io/shared: "true"
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 80
      targetPort: 8080
