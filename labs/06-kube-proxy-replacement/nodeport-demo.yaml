apiVersion: v1
kind: Namespace
metadata:
  name: kpr-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: kpr-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: echo
  template:
    metadata:
      labels:
        app: echo
    spec:
      containers:
        - name: httpbin
          image: mccutchen/go-httpbin:v2.14.0
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: echo-nodeport
  namespace: kpr-demo
spec:
  type: NodePort
  selector:
    app: echo
  ports:
    - name: http
      port: 80
      targetPort: 8080
      nodePort: 30080
