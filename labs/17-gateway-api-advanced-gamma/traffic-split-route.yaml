apiVersion: cilium.io/v2alpha1
kind: CiliumGatewayClassConfig
metadata:
  name: advanced-nodeport-config
  namespace: gateway-advanced
spec:
  service:
    type: NodePort
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: cilium-advanced-nodeport
spec:
  controllerName: io.cilium/gateway-controller
  parametersRef:
    group: cilium.io
    kind: CiliumGatewayClassConfig
    name: advanced-nodeport-config
    namespace: gateway-advanced
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: advanced-gateway
  namespace: gateway-advanced
spec:
  gatewayClassName: cilium-advanced-nodeport
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web-split
  namespace: gateway-advanced
spec:
  parentRefs:
    - name: advanced-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /get
      backendRefs:
        - name: web-v1
          port: 80
          weight: 80
        - name: web-v2
          port: 80
          weight: 20
    - matches:
        - path:
            type: PathPrefix
            value: /version
      backendRefs:
        - name: web-v1
          port: 80
          weight: 80
        - name: web-v2
          port: 80
          weight: 20
