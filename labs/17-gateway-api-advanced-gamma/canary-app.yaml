apiVersion: v1
kind: Namespace
metadata:
  name: gateway-advanced
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-v1
  namespace: gateway-advanced
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
      version: v1
  template:
    metadata:
      labels:
        app: web
        version: v1
    spec:
      containers:
        - name: echo
          image: hashicorp/http-echo:0.2.3
          args:
            - "-listen=:8080"
            - "-text=version=v1"
          ports:
            - containerPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-v2
  namespace: gateway-advanced
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
      version: v2
  template:
    metadata:
      labels:
        app: web
        version: v2
    spec:
      containers:
        - name: echo
          image: hashicorp/http-echo:0.2.3
          args:
            - "-listen=:8080"
            - "-text=version=v2"
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: web-v1
  namespace: gateway-advanced
spec:
  selector:
    app: web
    version: v1
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: web-v2
  namespace: gateway-advanced
spec:
  selector:
    app: web
    version: v2
  ports:
    - name: http
      port: 80
      targetPort: 8080
