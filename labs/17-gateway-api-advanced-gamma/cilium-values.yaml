ipam:
  mode: kubernetes

kubeProxyReplacement: true
k8sServiceHost: cilium-gateway-advanced-control-plane
k8sServicePort: 6443

loadBalancer:
  mode: snat

gatewayAPI:
  enabled: true

hostServices:
  enabled: false
externalIPs:
  enabled: true
nodePort:
  enabled: true
hostPort:
  enabled: true

hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true

operator:
  replicas: 1

image:
  pullPolicy: IfNotPresent
