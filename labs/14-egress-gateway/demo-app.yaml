apiVersion: v1
kind: Namespace
metadata:
  name: egress-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: egress-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
    spec:
      containers:
        - name: curl
          image: curlimages/curl:8.11.1
          command: ["sleep", "3600"]
