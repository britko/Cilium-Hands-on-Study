apiVersion: v1
kind: Namespace
metadata:
  name: bgp-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: bgp-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: httpbin
          image: mccutchen/go-httpbin:v2.14.0
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: bgp-demo
  labels:
    expose: bgp
spec:
  type: LoadBalancer
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: 8080
